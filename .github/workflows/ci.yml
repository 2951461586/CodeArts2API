name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化："; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

      - name: 控制台 JS/CSS 检查
        run: python tools/check_html_js.py

      - name: 构建
        run: go build -trimpath -ldflags "-s -w -X main.version=ci" -o /tmp/codearts2api .

  build-windows:
    name: build + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Windows 专属代码（DPAPI / 定长回写）只在 build tag 为 windows 时编译，
      # 因此必须单独跑一遍，避免 linux 任务漏掉编译错误。
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
